# SemiGod fork: aplica los commits [semigod-patch] sobre un release de Postiz
# y publica la imagen en ghcr.io/<dueño>/postiz-semigod:<tag>-semigod
name: SemiGod build

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Tag de Postiz (ej. v2.26.0). Vacío = el último release'
        required: false
  schedule:
    - cron: '17 9 * * 1' # lunes 09:17 UTC: revisa si hay release nuevo

permissions:
  contents: write
  packages: write

env:
  PLATFORM: linux/amd64     # cambiar a linux/arm64 si ergon_2 es ARM
  MAX_VIDEO_MB: '10240'     # tope de video en el frontend (10 GB)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Elegir versión de Postiz
        id: v
        run: |
          git remote add upstream https://github.com/gitroomhq/postiz-app.git
          git fetch --quiet upstream --tags
          TAG="${{ inputs.upstream_tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(git ls-remote --tags --refs --sort=-v:refname upstream 'v*' | head -1 | sed 's#.*/##')
          fi
          OUT="${TAG}-semigod"
          if [ "${{ github.event_name }}" = "schedule" ] && git ls-remote --exit-code --tags origin "refs/tags/$OUT" >/dev/null; then
            echo "Ya existe $OUT, nada que hacer"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/postiz-semigod" >> "$GITHUB_OUTPUT"

      - name: Aplicar parche sobre el release
        if: steps.v.outputs.skip != 'true'
        run: |
          git config user.name "semigod-bot"
          git config user.email "info@semigod.cl"
          PATCHES=$(git log --reverse --format=%H --grep='^\[semigod-patch\]' HEAD)
          [ -n "$PATCHES" ] || { echo "::error::No hay commits [semigod-patch]"; exit 1; }
          git checkout --quiet -B build "${{ steps.v.outputs.tag }}"
          for c in $PATCHES; do
            git cherry-pick -x "$c" || {
              echo "::error::El parche no aplica sobre ${{ steps.v.outputs.tag }}. Resolver el conflicto a mano (ver SEMIGOD.md)."
              exit 1
            }
          done
          git tag -f "${{ steps.v.outputs.out }}"
          git push -f origin "refs/tags/${{ steps.v.outputs.out }}"

      - uses: docker/setup-buildx-action@v3
        if: steps.v.outputs.skip != 'true'

      - uses: docker/login-action@v3
        if: steps.v.outputs.skip != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build y push
        if: steps.v.outputs.skip != 'true'
        run: |
          docker buildx build --platform "$PLATFORM" \
            -f Dockerfile.dev \
            --build-arg NEXT_PUBLIC_VERSION=${{ steps.v.outputs.out }} \
            --build-arg NEXT_PUBLIC_MAX_VIDEO_UPLOAD_MB=$MAX_VIDEO_MB \
            -t ${{ steps.v.outputs.image }}:${{ steps.v.outputs.out }} \
            -t ${{ steps.v.outputs.image }}:latest \
            --provenance=false --sbom=false --push .
